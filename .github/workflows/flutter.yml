# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # Use latest stable Flutter version

      - name: Install dependencies
        working-directory: baby_words_tracker
        run: flutter pub get

      # Analyze for errors only (fail build on actual errors, ignore warnings/info)
      - name: Analyze for errors
        working-directory: baby_words_tracker
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        
      # Show full analysis output for visibility (warnings/info shown but not blocking)
      - name: Show full analysis output
        working-directory: baby_words_tracker
        run: flutter analyze || echo "Full analysis completed - warnings/info shown above for developer reference"

      # Run tests - Flutter projects use 'flutter test'
      - name: Run tests
        working-directory: baby_words_tracker
        run: flutter test

      # Verify builds work for different platforms
      - name: Build APK (Android)
        working-directory: baby_words_tracker
        run: flutter build apk --debug

      - name: Build Web
        working-directory: baby_words_tracker
        run: flutter build web

      # iOS build commented out - requires macOS runner which costs more
      # - name: Build iOS (requires macOS runner)  
      #   working-directory: baby_words_tracker
      #   run: flutter build ios --no-codesign
